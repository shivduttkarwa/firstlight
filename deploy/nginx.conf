upstream firstlight_api {
    server unix:/run/firstlight/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    client_max_body_size 20m;
    root /srv/firstlight/web;

    location ~ ^/(api|admin|django-admin|documents)(/|$) {
        proxy_pass http://firstlight_api;
        proxy_set_header Host $host;
        # Overwrite, don't append: DRF throttles sign-in by this header, so a client must not be able to set it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }

    location /static/ {
        alias /srv/firstlight/app/backend/staticfiles/;
        gzip_static on;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location /media/ {
        alias /srv/firstlight/app/backend/media/;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
        access_log off;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
